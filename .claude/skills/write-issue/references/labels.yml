# CEDA Labels — de machine-bron van namen, kleuren en beschrijvingen.
#
# BRON VAN WAARHEID: dit bestand in cedanl/.github. Alleen daar draait
# .github/workflows/sync-labels.yml, die de set wekelijks naar alle cedanl-repos
# duwt (create/update; verwijdert nooit). Kom je dit bestand tegen in een andere
# repo, dan is dat een kopie van `npx skills add` en doet het niets — bewerk het
# origineel.
#
# De indeling, de condities per categorie en de regels voor uitbreiden staan in
# labels.md, hiernaast. Eén kleur per categorie.
#
# Priority en Iteration zijn GEEN labels: dat zijn velden op het CEDA Board.


<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITEL}}</title>
<!--
  clanna-frame v1 — gebaseerd op het deck "Welk open-source model kan mijn LLM-wiki
  het beste onderhouden?" van Janna Berkhout (KIS). Huisstijl: vormgever-npuls-huisstijl.
  Dit bestand hoort in de root van clidev-presentaties: de fonts, het logo en de
  illustraties komen uit public/npuls/ (relatieve paden).
-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ============================================================
   NPULS FONTS — echte assets uit public/npuls/
   ============================================================ */
@font-face{font-family:'General Sans';src:url('public/npuls/Npuls_lettertype/Npuls_lettertype_generalsans_regular.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'General Sans';src:url('public/npuls/Npuls_lettertype/Npuls_lettertype_generalsans_semibold.otf') format('opentype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'Cooper Light BT';src:url('public/npuls/Npuls_lettertype/Npuls_lettertype_cooper_light_bt.ttf') format('truetype');font-weight:300;font-style:normal;font-display:swap}

/* ============================================================
   NPULS DESIGN TOKENS (waarden: vormgever-npuls-huisstijl)
   ============================================================ */
:root{
  --npuls-oranje:#DD784B;
  --npuls-zwart:#000000;
  --npuls-roze:#F4D9DC;
  --npuls-blauw:#3D68EC;
  --npuls-geel:#F4D74B;
  --npuls-groen:#00AF81;
  --npuls-wit:#FFFFFF;

  --licht-groen:#CCEEE6;
  --licht-blauw:#D6E2FD;
  --licht-roze:#FAEAEA;
  --licht-oranje:#FFE4D8;
  --licht-geel:#FCF5D4;

  /* neutraal vlak uit het officiële Npuls-pptx-template (Tussendia, Titeldia 3,
     Afbeeldingen en vormen). Alleen als layout-vlak via .lay-*, nooit als kaart. */
  --npuls-grijs:#E6E6E6;

  --font-primair:'General Sans',system-ui,-apple-system,sans-serif;
  --font-secundair:'Cooper Light BT',Georgia,serif;

  --ink:var(--npuls-zwart);
  --paper:var(--npuls-wit);
  --accent:var(--npuls-blauw);
  --accent-2:var(--npuls-geel);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-primair);
  font-weight:400;
  color:var(--ink);
  background:var(--npuls-zwart);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   SLIDE FRAME
   ============================================================ */
.deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:clamp(28px,4.2vw,80px) clamp(28px,5.5vw,110px) clamp(72px,7vh,104px);
  background:var(--paper);
  color:var(--ink);
  overflow:hidden;
  opacity:0;visibility:hidden;
  transform:translateY(14px);
  transition:opacity .38s ease,transform .38s ease,visibility .38s;
}
.slide.active{opacity:1;visibility:visible;transform:translateY(0);z-index:2}
.slide>*{position:relative;z-index:3}

/* slide-varianten: alleen toegestane kleurcombinaties */
.s-blauw  {--paper:var(--npuls-blauw); --ink:var(--npuls-wit);  --accent:var(--npuls-geel);   --accent-2:var(--npuls-roze)}
.s-roze   {--paper:var(--npuls-roze);  --ink:var(--npuls-zwart);--accent:var(--npuls-blauw);  --accent-2:var(--npuls-oranje)}
.s-geel   {--paper:var(--npuls-geel);  --ink:var(--npuls-zwart);--accent:var(--npuls-blauw);  --accent-2:var(--npuls-oranje)}
.s-groen  {--paper:var(--npuls-groen); --ink:var(--npuls-zwart);--accent:var(--npuls-roze);   --accent-2:var(--npuls-wit)}
.s-oranje {--paper:var(--npuls-oranje);--ink:var(--npuls-zwart);--accent:var(--npuls-roze);   --accent-2:var(--npuls-wit)}
.s-lblauw {--paper:var(--licht-blauw); --ink:var(--npuls-zwart);--accent:var(--npuls-blauw);  --accent-2:var(--npuls-oranje)}
.s-lgroen {--paper:var(--licht-groen); --ink:var(--npuls-zwart);--accent:var(--npuls-groen);  --accent-2:var(--npuls-oranje)}
.s-lgeel  {--paper:var(--licht-geel);  --ink:var(--npuls-zwart);--accent:var(--npuls-oranje); --accent-2:var(--npuls-blauw)}
.s-lroze  {--paper:var(--licht-roze);  --ink:var(--npuls-zwart);--accent:var(--npuls-oranje); --accent-2:var(--npuls-blauw)}
.s-loranje{--paper:var(--licht-oranje);--ink:var(--npuls-zwart);--accent:var(--npuls-oranje); --accent-2:var(--npuls-blauw)}
.s-wit    {--paper:var(--npuls-wit);   --ink:var(--npuls-zwart);--accent:var(--npuls-blauw);  --accent-2:var(--npuls-groen)}

/* ============================================================
   TYPOGRAFIE
   ============================================================ */
h1{font-size:clamp(34px,4.6vw,58px);font-weight:600;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(26px,3.1vw,38px);font-weight:600;line-height:1.1;letter-spacing:-.015em}
h3{font-size:clamp(17px,1.6vw,23px);font-weight:600;line-height:1.2}
p,li{font-size:clamp(14px,1.12vw,17px);line-height:1.55}
.lede{
  font-family:var(--font-secundair);font-weight:300;
  font-size:clamp(17px,1.8vw,26px);line-height:1.38;
  max-width:34ch;
}
.label{
  display:inline-flex;align-items:center;gap:.5em;
  font-size:clamp(10px,.82vw,13px);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
}
.kicker{
  display:inline-block;align-self:flex-start;
  background:var(--accent);color:var(--paper);
  padding:.42em .95em;border-radius:99px;
  font-size:clamp(10px,.82vw,13px);font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:clamp(14px,1.8vh,24px);
}
.s-blauw .kicker,.s-groen .kicker,.s-oranje .kicker{color:var(--npuls-zwart)}
.slide-head{margin-bottom:clamp(18px,2.6vh,34px);flex-shrink:0;max-width:78%}
.slide-head h2 .hl{color:var(--accent)}
.sub{margin-top:.7em;opacity:.78;max-width:62ch;font-size:clamp(13px,1.05vw,16px)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}
/* inhoud op 1/3 van de vrije ruimte, niet midden: geen gat onder de kop */
.body::before{content:'';flex:1 1 0;max-height:4vh}
.body::after{content:'';flex:2 1 0}
strong{font-weight:600}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92em}
.payoff{font-weight:600;letter-spacing:-.01em}

/* ============================================================
   COMPONENTEN
   ============================================================ */
.grid{display:grid;gap:clamp(12px,1.35vw,22px)}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

.card{
  background:var(--npuls-wit);
  border-radius:20px;
  padding:clamp(16px,1.5vw,26px);
  display:flex;flex-direction:column;gap:.55em;
}
.card.row{flex-direction:row;align-items:center;gap:1.2em}
.card.blauw{background:var(--npuls-blauw);color:var(--npuls-wit)}
.card.geel{background:var(--npuls-geel)}
.card.roze{background:var(--npuls-roze)}
.card.groen{background:var(--npuls-groen)}
.card.oranje{background:var(--npuls-oranje)}
.card.lblauw{background:var(--licht-blauw)}
.card.lgroen{background:var(--licht-groen)}
.card.lgeel{background:var(--licht-geel)}
.card.lroze{background:var(--licht-roze)}
.card.loranje{background:var(--licht-oranje)}
.card p{opacity:.85}
.card h3{letter-spacing:-.01em}

.ico{
  width:clamp(34px,3vw,46px);height:clamp(34px,3vw,46px);
  border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;
  font-size:clamp(15px,1.25vw,19px);
}
.ico.blauw{background:var(--npuls-blauw);color:var(--npuls-geel)}
.ico.geel{background:var(--npuls-geel);color:var(--npuls-blauw)}
.ico.roze{background:var(--npuls-roze);color:var(--npuls-zwart)}
.ico.groen{background:var(--npuls-groen);color:var(--npuls-roze)}
.ico.oranje{background:var(--npuls-oranje);color:var(--npuls-zwart)}
.ico.zwart{background:var(--npuls-zwart);color:var(--npuls-geel)}
.ico.wit{background:var(--npuls-wit);color:var(--npuls-blauw)}

.steps{display:flex;flex-direction:column;gap:clamp(6px,.8vh,11px)}
.step{display:flex;gap:clamp(11px,1.1vw,18px);align-items:flex-start;
  background:var(--npuls-wit);border-radius:18px;padding:clamp(10px,.95vw,15px) clamp(13px,1.2vw,20px)}
.step .num{
  flex-shrink:0;width:clamp(28px,2.4vw,38px);height:clamp(28px,2.4vw,38px);
  border-radius:99px;display:grid;place-items:center;font-weight:600;
  font-size:clamp(12px,1vw,15px);
}
.step-t{font-weight:600;font-size:clamp(14px,1.18vw,18px);margin-bottom:.2em}
.step p{opacity:.8}

.minirow{display:flex;justify-content:space-between;align-items:baseline;gap:1em;
  padding:.4em 0;border-bottom:1px solid rgba(0,0,0,.08);font-size:clamp(12px,1.02vw,15.5px)}
.minirow b{font-weight:600;font-variant-numeric:tabular-nums}

.badge{
  display:inline-block;font-style:normal;font-weight:600;
  font-size:clamp(9px,.72vw,11px);text-transform:uppercase;letter-spacing:.07em;
  padding:.28em .6em;border-radius:99px;margin-left:.45em;vertical-align:.08em;
  background:var(--npuls-zwart);color:var(--npuls-geel);
}

/* scorebalken: --w op .bar-fill zet de lengte, animeert bij binnenkomst */
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  column-gap:clamp(10px,1.1vw,18px);row-gap:clamp(8px,1.25vh,17px);align-items:center}
.bar-row{display:contents}
.bar-name{font-weight:600;font-size:clamp(12px,1.02vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-name .tag{font-weight:400;opacity:.55;font-size:.82em}
.bar-track{position:relative;height:clamp(20px,2.1vw,34px);background:rgba(0,0,0,.075);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;width:0;transition:width .85s cubic-bezier(.2,.75,.3,1)}
.slide.active .bar-fill{width:var(--w)}
.bar-val{font-weight:600;font-variant-numeric:tabular-nums;font-size:clamp(12px,1.05vw,16px);min-width:3.4em;text-align:right}
.bar-row.win .bar-name{color:var(--npuls-blauw)}
.bar-row.ref .bar-name,.bar-row.ref .bar-val{opacity:.55}
.bar-row.ref .bar-name{font-style:italic}

.legend{display:flex;flex-wrap:wrap;gap:clamp(10px,1.2vw,22px);margin-top:clamp(12px,1.6vh,20px);font-size:clamp(11px,.9vw,14px);opacity:.8}
.legend span{display:inline-flex;align-items:center;gap:.5em}
.swatch{width:13px;height:13px;border-radius:4px;display:inline-block}

/* titelslide — gecentreerd */
.title-body{align-items:center;justify-content:center;text-align:center}
.title-body::before,.title-body::after{flex:1 1 0;max-height:none}
.title-body h1{max-width:18ch}
.title-body .lede{max-width:46ch}

/* Mentimeter */
.menti-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1vh,12px)}
.menti-frame{position:relative;height:100%;width:auto;aspect-ratio:16/9;max-width:100%;
  border-radius:20px;overflow:hidden;background:var(--npuls-wit);box-shadow:0 2px 18px rgba(0,0,0,.07)}
.menti-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.menti-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.7em;text-align:center;padding:clamp(18px,2.5vw,40px);
  background:var(--npuls-wit);border:2px dashed rgba(0,0,0,.18);border-radius:20px}
.menti-placeholder p{max-width:52ch;opacity:.75}
.menti-placeholder code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:.92em;
  background:rgba(0,0,0,.06);padding:.15em .45em;border-radius:6px}
.menti-hint{flex-shrink:0;font-size:clamp(10px,.85vw,13px);opacity:.6;text-align:center}

/* procesketen: node → hop → node */
.chain{display:flex;align-items:stretch;gap:clamp(6px,.75vw,12px)}
.node{flex:1;display:flex;flex-direction:column;justify-content:center;background:var(--npuls-wit);border-radius:14px;padding:clamp(9px,.85vw,14px) clamp(10px,.95vw,16px);min-width:0}
.node b{display:block;font-size:clamp(13px,1.1vw,17px);font-weight:600}
.node span{display:block;font-size:clamp(11px,.9vw,14px);opacity:.7;margin-top:.15em;line-height:1.35}
.node.lblauw{background:var(--licht-blauw)}
.node.lgeel{background:var(--licht-geel)}
.node.lgroen{background:var(--licht-groen)}
.hop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em;flex-shrink:0;padding:0 .1em;color:var(--accent-2)}
.hop b{font-size:clamp(9.5px,.78vw,12px);font-weight:600;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.hop i{font-size:clamp(12px,1vw,15px)}

/* grafiek (inline SVG) */
.chart-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.chart{width:100%;height:auto;max-height:100%;display:block}
.chart .ax{font-family:var(--font-primair);font-size:15px;font-weight:500;fill:var(--npuls-zwart);opacity:.5}
.chart .ann{font-family:var(--font-primair);font-size:15px;font-weight:600;opacity:.85}
.chart-foot{display:flex;flex-wrap:wrap;align-items:center;gap:clamp(10px,1.6vw,28px);margin-top:clamp(8px,1.2vh,16px)}
.chip{display:inline-flex;align-items:baseline;gap:.5em;background:var(--npuls-wit);border-radius:14px;padding:.55em .95em}
.chip b{font-size:clamp(16px,1.5vw,23px);font-weight:600;letter-spacing:-.02em}
.chip span{font-size:clamp(11px,.88vw,13.5px);font-weight:600;text-transform:uppercase;letter-spacing:.07em;opacity:.65}
.src{font-size:clamp(10.5px,.85vw,13px);opacity:.55;margin-left:auto}

/* tabel: rijen als witte pillen */
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(11.5px,1vw,15px)}
th{
  text-align:left;font-weight:600;font-size:clamp(10px,.8vw,12.5px);
  text-transform:uppercase;letter-spacing:.07em;opacity:.6;
  padding:0 .8em .2em;
}
td{padding:.62em .8em;background:var(--npuls-wit);vertical-align:top}
tr td:first-child{border-radius:12px 0 0 12px;font-weight:600}
tr td:last-child{border-radius:0 12px 12px 0}

/* uitgelicht */
.pull{
  font-family:var(--font-secundair);font-weight:300;
  font-size:clamp(20px,2.5vw,36px);line-height:1.25;
  max-width:24ch;
}
.big-num{font-size:clamp(40px,5vw,76px);font-weight:600;line-height:.95;letter-spacing:-.03em}
.stat{display:flex;flex-direction:column;gap:.25em}
.stat .cap{font-size:clamp(11px,.9vw,14px);font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.7}

ul.ticks{list-style:none;display:flex;flex-direction:column;gap:.55em}
ul.ticks li{display:flex;gap:.7em;align-items:flex-start}
ul.ticks li i{margin-top:.28em;font-size:.82em;color:var(--accent)}
ul.ticks.groot{gap:.8em}
ul.ticks.groot li{font-size:clamp(18px,1.9vw,30px);line-height:1.3}

.split{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(22px,3vw,58px);align-items:center;flex:1;min-height:0}

/* Npuls-illustraties (public/npuls/powerpoint_illustrations) */
.illu{display:block;width:100%;height:auto;max-height:min(52vh,520px);object-fit:contain}
.illu-sm{display:block;width:clamp(64px,7vw,120px);height:auto}

/* logo (public/npuls/npuls_logo.jpg, roze achtergrond: alleen op s-roze) */
.logo{width:clamp(120px,13vw,220px);height:auto;display:block}

/* ============================================================
   VORMENTAAL — decoratieve SVG's in de hoeken
   ============================================================ */
.deco{position:absolute;z-index:1;pointer-events:none}
.deco.tr{top:-4%;right:-3%}
.deco.br{bottom:-8%;right:-4%}
.deco.bl{bottom:-6%;left:-5%}
.deco.tl{top:-6%;left:-4%}

/* ============================================================
   NPULS-TEMPLATE — logo, bogen en layouts uit het officiële
   pptx-template (public/npuls/Npuls_powerpoint-template.potx).
   Vormen: public/npuls/vormen/*.svg
   ============================================================ */

/* logo linksboven (zwarte SVG; wit via invert op blauw, groen en oranje) */
.npuls-logo{
  position:absolute;z-index:4;
  top:clamp(22px,3.6vh,46px);left:clamp(28px,5.5vw,110px);
  width:clamp(92px,8vw,150px);height:auto;
  filter:var(--logo-filter,none);
}
.npuls-logo.groot{position:relative;top:auto;left:auto;width:clamp(220px,25vw,440px)}
.slide:has(.npuls-logo:not(.groot)){padding-top:clamp(84px,13vh,150px)}
.s-blauw,.s-groen,.s-oranje{--logo-filter:invert(1)}
.partner-paneel{--logo-filter:none}

/* drie bogen rechtsonder: het vaste Npuls-template-motief.
   Schrijf <div class="deco bogen"></div>; het script zet de SVG erin. */
.bogen{
  position:absolute;right:0;bottom:0;z-index:1;pointer-events:none;
  width:clamp(110px,14.5vw,280px);aspect-ratio:1;
}
.bogen svg{display:block;width:100%;height:100%}
.bogen path{fill:var(--boog,var(--npuls-oranje))}
.s-geel,.s-oranje{--boog:var(--npuls-zwart)}
.s-blauw,.s-groen{--boog:var(--npuls-wit)}
.s-roze{--boog:var(--npuls-oranje)}

/* tegels: vierkante vormblokken uit het template */
.tegel{display:block;width:100%;height:100%;object-fit:cover}

/* Titeldia — groot, links uitgelijnd, logo + bogen */
.lay-titel .body{justify-content:center}
.lay-titel .body::before,.lay-titel .body::after{display:none}
.lay-titel h1{font-size:clamp(40px,5.4vw,80px);max-width:16ch}
.lay-titel .lede{margin-top:clamp(16px,2.4vh,30px);max-width:38ch}
.lay-titel .meta{margin-top:clamp(22px,3.4vh,44px);opacity:.75}

/* Titeldia 3 — grijze driehoek links op een verzadigde slide */
.lay-driehoek::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:31%;z-index:0;
  background:var(--npuls-grijs);clip-path:polygon(0 0,100% 50%,0 100%);
}
.lay-driehoek{padding-left:36%}
.lay-driehoek .body{justify-content:center}
.lay-driehoek .body::before,.lay-driehoek .body::after{display:none}
.lay-driehoek h1{font-size:clamp(38px,5vw,74px);max-width:15ch}

/* Sectiescheider — vol vlak, grote kop onderaan, bogen */
.slide.lay-sectie{padding-bottom:clamp(96px,13vh,150px)}
.lay-sectie .body{justify-content:flex-end}
.lay-sectie .body::before,.lay-sectie .body::after{display:none}
.lay-sectie .nr{font-size:clamp(15px,1.3vw,20px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:.6em}
.lay-sectie h1{font-size:clamp(44px,6vw,92px);max-width:14ch}

/* Tussendia — gekleurde band links, grijs vlak rechts */
.lay-band{
  background:linear-gradient(90deg,var(--paper) 0 32%,var(--npuls-grijs) 32% 100%);
  display:grid;grid-template-columns:32% 1fr;padding:0;
}
.lay-band>.band-l{padding:clamp(28px,4.2vw,80px) clamp(24px,3vw,56px) clamp(72px,7vh,104px) clamp(28px,5.5vw,110px);display:flex;flex-direction:column;justify-content:flex-end}
.lay-band>.band-r{color:var(--npuls-zwart);padding:clamp(28px,4.2vw,80px) clamp(28px,5.5vw,110px) clamp(72px,7vh,104px) clamp(28px,4vw,72px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.lay-band .band-l .big-num{font-size:clamp(64px,8vw,140px)}

/* Quote — Cooper, groot, met openingsteken in de accentkleur */
.lay-quote .body{justify-content:center}
.lay-quote .body::before,.lay-quote .body::after{display:none}
.quote{font-family:var(--font-secundair);font-weight:300;font-size:clamp(28px,3.6vw,56px);line-height:1.18;max-width:22ch}
.quote::before{content:'\201C';display:block;color:var(--accent-2);font-size:1.9em;line-height:.6;margin-bottom:.15em}
.quote-bron{margin-top:clamp(16px,2.4vh,30px);font-weight:600}

/* Tekst en vorm-blokken — 2×3 tegels tegen de rechterrand */
.tegels{
  position:absolute;right:0;top:0;bottom:0;z-index:1;
  height:100%;aspect-ratio:2/3;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);
}
.lay-blokken{padding-right:calc(100vh*2/3 + clamp(28px,4vw,80px))}

/* Afbeeldingen en vormen — grijs vlak met twee verspringende tegels */
.lay-vormen{background:var(--npuls-grijs);--ink:var(--npuls-zwart);color:var(--ink);padding-right:52%}
.vormen-duo{position:absolute;inset:0;z-index:1;pointer-events:none}
.vormen-duo .tegel{position:absolute;width:50vh;height:50vh}
.vormen-duo .tegel:first-child{top:0;right:calc(10% + 25vh)}
.vormen-duo .tegel:last-child{bottom:0;right:10%}
.vormen-duo::after{content:'';position:absolute;top:50vh;right:0;width:calc(10% + 25vh);border-top:1.5px solid var(--npuls-oranje)}

/* Stappen — oranje golf links, grijze stappen rechts */
.lay-stappen .golf{position:absolute;left:0;top:50%;transform:translateY(-42%);width:30%;height:auto;z-index:1;pointer-events:none}
.lay-stappen{padding-left:36%}
.lay-stappen .step{background:var(--npuls-grijs)}

/* Partnerslide — tekst links, roze paneel met logo rechts */
.lay-partner{padding-right:54%}
.partner-paneel{position:absolute;right:0;top:0;bottom:0;width:50%;z-index:1;background:var(--npuls-roze);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3vh,40px)}
.partner-logos{display:flex;gap:clamp(18px,2.4vw,44px);align-items:center;flex-wrap:wrap;justify-content:center}
.partner-logos img{height:clamp(36px,5vh,64px);width:auto}

/* Einddia — tegelmozaïek links, logo + vraag rechts, CC-licentie */
.lay-eind{padding-left:calc(100vh*2/3 + clamp(36px,5vw,96px))}
.lay-eind .tegels{left:0;right:auto}
.lay-eind .body{justify-content:center;align-items:flex-start}
.lay-eind .body::before,.lay-eind .body::after{display:none}
.cc{position:absolute;right:clamp(28px,4vw,80px);bottom:clamp(22px,4vh,48px);width:clamp(90px,8vw,150px);height:auto;z-index:3}

@media (max-aspect-ratio:4/3){
  .lay-blokken,.lay-eind{padding-left:clamp(28px,5.5vw,110px);padding-right:clamp(28px,5.5vw,110px)}
  .lay-blokken .tegels,.lay-eind .tegels{display:none}
}

/* ============================================================
   NAVIGATIE — linksonder (rechtsonder is voor de bogen)
   ============================================================ */
.nav{
  position:fixed;left:0;bottom:0;z-index:20;
  display:flex;align-items:center;gap:clamp(14px,1.6vw,26px);
  padding:clamp(12px,1.4vh,20px) clamp(28px,5.5vw,110px);
  pointer-events:none;
}
.nav.na-tegels{left:calc(100vh*2/3)}
.dots{display:flex;gap:7px;pointer-events:auto}
.dot{
  width:8px;height:8px;border-radius:99px;border:none;cursor:pointer;padding:0;color:inherit;
  background:currentColor;opacity:.25;transition:opacity .2s,width .2s;
}
.dot.on{opacity:1;width:24px}
.nav-right{display:flex;align-items:center;gap:14px;pointer-events:auto}
.counter{font-size:clamp(11px,.9vw,13px);font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;opacity:.65}
.navbtn{
  width:34px;height:34px;border-radius:99px;border:1.5px solid currentColor;
  background:transparent;color:inherit;cursor:pointer;
  display:grid;place-items:center;font-size:12px;opacity:.6;transition:opacity .2s;
}
.navbtn:hover{opacity:1}
.brand{
  position:fixed;top:clamp(18px,2.4vh,30px);right:clamp(28px,5.5vw,110px);z-index:20;
  font-size:clamp(11px,.88vw,13px);font-weight:600;letter-spacing:.09em;text-transform:uppercase;opacity:.55;
}

/* lage schermen (beamers, 768px-laptops): alles een slag compacter */
@media (max-height:840px){
  .slide{padding-top:clamp(20px,3vw,52px);padding-bottom:62px}
  .slide-head{margin-bottom:clamp(10px,1.7vh,20px)}
  h1{font-size:clamp(30px,4vw,48px)}
  h2{font-size:clamp(23px,2.7vw,32px)}
  h3{font-size:clamp(15px,1.4vw,19px)}
  p,li{font-size:clamp(12.5px,1vw,15px)}
  .sub{font-size:clamp(12px,.98vw,14.5px)}
  .card{padding:clamp(11px,1.15vw,17px);gap:.4em}
  .grid{gap:clamp(8px,1vw,15px)}
  .ico{width:clamp(28px,2.5vw,38px);height:clamp(28px,2.5vw,38px);border-radius:11px;font-size:clamp(13px,1.1vw,16px)}
  .step{padding:clamp(8px,.82vw,13px) clamp(11px,1vw,17px)}
  .steps{gap:clamp(5px,.7vh,9px)}
  .big-num{font-size:clamp(32px,4vw,58px)}
  .kicker{margin-bottom:clamp(8px,1.3vh,16px)}
}
@media (max-width:820px){
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr;align-items:start}
}
@media print{
  body{overflow:visible;background:var(--npuls-wit)}
  .deck{height:auto}
  .slide{position:relative;opacity:1;visibility:visible;transform:none;height:100vh;page-break-after:always;inset:auto}
  .nav,.brand{display:none}
  .bar-fill{width:var(--w)!important}
}
@media (prefers-reduced-motion:reduce){
  .slide,.bar-fill{transition:none}
}
</style>
</head>
<body>

<div class="brand" id="brand">{{BRAND}}</div>

<div class="deck" id="deck">

<!-- SLIDES:START -->

<!-- ========== 1. TITEL (template: Titeldia) ========== -->
<section class="slide s-roze lay-titel active">
  <img class="npuls-logo" src="public/npuls/vormen/npuls-logo.svg" alt="Npuls">
  <div class="deco bogen"></div>
  <div class="body">
    <span class="kicker">{{KICKER}}</span>
    <h1>{{TITEL}}</h1>
    <p class="lede">{{LEDE}}</p>
    <p class="meta">{{SPREKER}} &middot; {{TEAM}} &middot; {{DATUM}}</p>
  </div>
</section>

<!-- ========== N. AFSLUITING (template: Einddia) ========== -->
<section class="slide s-roze lay-eind">
  <div class="tegels" aria-hidden="true">
    <img class="tegel" src="public/npuls/vormen/tegel-pijl-oranje.svg" alt="">
    <img class="tegel" src="public/npuls/vormen/tegel-cirkel-geel.svg" alt="">
    <img class="tegel" src="public/npuls/vormen/tegel-doel-groen.svg" alt="">
    <img class="tegel" src="public/npuls/vormen/tegel-ster-oranje.svg" alt="">
    <img class="tegel" src="public/npuls/vormen/tegel-schakelaar-blauw.svg" alt="">
    <img class="tegel" src="public/npuls/vormen/tegel-chevrons-zwart.svg" alt="">
  </div>
  <div class="body">
    <img class="npuls-logo groot" src="public/npuls/vormen/npuls-logo.svg" alt="Npuls">
    <h2 style="margin-top:clamp(22px,3.4vh,44px);max-width:20ch">{{AFSLUITVRAAG}}</h2>
    <p style="margin-top:clamp(14px,2vh,24px);opacity:.75">{{CONTACT}}</p>
    <p class="payoff" style="margin-top:clamp(20px,3vh,38px)">Onderwijs bewegen.</p>
  </div>
  <img class="cc" src="public/npuls/vormen/cc-by-sa.svg" alt="Creative Commons BY-SA">
</section>

<!-- SLIDES:END -->

</div><!-- /deck -->

<div class="nav">
  <div class="dots" id="dots"></div>
  <div class="nav-right">
    <span class="counter" id="counter"></span>
    <button class="navbtn" id="prev" aria-label="Vorige slide"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="navbtn" id="next" aria-label="Volgende slide"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
</div>

<script>
/* ============================================================
   MENTIMETER — Share -> Participants -> Embed slides -> Copy code.
   Alleen het stuk na src=" is nodig. Leeg laten = placeholder blijft staan.
   Aparte Menti per slide: zet poll1, poll2, ... erbij.
   ============================================================ */
const MENTI = { url: '' };

(function(){
  /* bogen: pad uit het Npuls-template (Bogen), kleur via --boog */
  const BOGEN='<svg viewBox="0 0 198.425 198.425" aria-hidden="true"><path d="M198.425 97.4007C148.43 101.505 108.256 144.383 103.222 198.425L106.877 198.425C111.886 146.568 150.437 105.454 198.425 101.368Z"/><path d="M198.425 49.9902C121.331 54.0228 58.2174 117.062 46.4388 198.425L50.1229 198.425C61.8583 119.251 123.34 57.9749 198.425 53.9562Z"/><path d="M198.425 0C99.9995 4.2638 18.6467 88.2546 0 198.425L3.70359 198.425C22.2677 90.4548 101.993 8.21808 198.425 3.96124Z"/></svg>';
  document.querySelectorAll('.bogen:empty').forEach(b=>{b.innerHTML=BOGEN});

  const slides=[...document.querySelectorAll('.slide')];
  const dotsWrap=document.getElementById('dots');
  const counter=document.getElementById('counter');
  const nav=document.querySelector('.nav');
  const brand=document.getElementById('brand');
  let i=0;

  slides.forEach((s,n)=>{
    s.classList.remove('active');
    const b=document.createElement('button');
    b.className='dot';
    b.setAttribute('aria-label','Slide '+(n+1));
    b.addEventListener('click',()=>go(n));
    dotsWrap.appendChild(b);
  });
  const dots=[...dotsWrap.children];
  const pad=n=>String(n).padStart(2,'0');

  // Mentimeter pas laden als de slide in beeld komt
  function loadMenti(slide){
    const key=slide.dataset.menti; if(!key) return;
    const url=(MENTI[key]||MENTI.url||'').trim(); if(!url) return;
    const slot=slide.querySelector('[data-menti-slot]');
    if(!slot || slot.dataset.loaded) return;
    const f=document.createElement('iframe');
    f.src=url;
    f.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation allow-popups allow-forms');
    f.setAttribute('allow','fullscreen');
    f.setAttribute('title','Mentimeter');
    slot.innerHTML=''; slot.appendChild(f); slot.dataset.loaded='1';
  }

  function go(n){
    if(n<0||n>=slides.length) return;
    slides[i].classList.remove('active'); dots[i].classList.remove('on');
    i=n;
    slides[i].classList.add('active'); dots[i].classList.add('on');
    counter.textContent=pad(i+1)+' / '+pad(slides.length);
    loadMenti(slides[i]);
    // navigatie neemt de tekstkleur van de slide-variant over
    const ink=getComputedStyle(slides[i]).color;
    nav.style.color=ink; brand.style.color=ink;
    // tegels linksonder (Einddia) of gekleurde band (Tussendia): navigatie schuift mee
    nav.classList.toggle('na-tegels',slides[i].classList.contains('lay-eind'));
    if(slides[i].classList.contains('lay-band')) nav.style.color=getComputedStyle(slides[i].querySelector('.band-l')||slides[i]).color;
    brand.style.visibility=(i===0||slides[i].matches('.lay-blokken,.lay-band,.lay-partner'))?'hidden':''; // titelslide noemt het team al, en daar zitten de ringen
    try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
  }

  document.getElementById('next').addEventListener('click',()=>go(i+1));
  document.getElementById('prev').addEventListener('click',()=>go(i-1));

  document.addEventListener('keydown',e=>{
    if(e.target && e.target.closest && e.target.closest('.menti-frame')) return;
    if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}
    else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}
    else if(e.key==='Home'){e.preventDefault();go(0)}
    else if(e.key==='End'){e.preventDefault();go(slides.length-1)}
    else if(e.key==='f'){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
  });

  // klik buiten een Menti-kader: toetsenbord terug naar het deck
  document.addEventListener('mousedown',e=>{
    if(!(e.target.closest && e.target.closest('.menti-frame')) && document.activeElement && document.activeElement.tagName==='IFRAME'){
      document.activeElement.blur(); window.focus();
    }
  });

  let x0=null;
  document.addEventListener('touchstart',e=>{x0=e.changedTouches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0;
    if(Math.abs(dx)>55) go(dx<0?i+1:i-1);
    x0=null;
  },{passive:true});

  window.addEventListener('hashchange',()=>{
    const h=parseInt((location.hash||'').replace('#s',''),10);
    if(Number.isFinite(h)&&h-1!==i) go(h-1);
  });

  const h=parseInt((location.hash||'').replace('#s',''),10);
  go(Number.isFinite(h)&&h>0&&h<=slides.length?h-1:0);
})();
</script>
</body>
</html>

site_name: CEDA Ontwikkelaarshandboek
site_url: https://cedanl.github.io/.github/
site_description: Ontwikkelstandaarden, ontwikkelstack, werkafspraken en handleidingen van het Centrum Educatieve Data Analyse (CEDA).
repo_url: https://github.com/cedanl/.github
repo_name: cedanl/.github
edit_uri: edit/main/docs/

docs_dir: docs
exclude_docs: |
  _template.md

theme:
  name: material
  language: nl
  logo: assets/logos/npuls_logo.jpg
  favicon: assets/logos/beeldmerk.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom

extra_css:
  - stylesheets/extra.css

nav:
  - Start: index.md
  - Ontwikkelstandaarden:
    - Overzicht: standards/index.md
    - Ontwikkelprincipes: standards/principles.md
    - Projectstructuur: standards/project-structure.md
    - Dataconventies: standards/data-conventions.md
    - Python-stijlgids: standards/python-style.md
    - R-stijlgids: standards/r-style.md
    - Migratie vanuit Cookiecutter: standards/migration-cookiecutter.md
  - Ontwikkelstack: tooling/index.md
  - Bijdragen: bijdragen/index.md
  - Werkafspraken:
    - Overzicht: werkafspraken/index.md
    - Devcontainer: werkafspraken/devcontainer.md
    - Pitches: werkafspraken/pitches.md
    - Presentaties: werkafspraken/presentaties.md
    - Gebruikersrechten: werkafspraken/gebruikersrechten.md
    - Feedback zonder persoonsgegevens: werkafspraken/feedback-zonder-persoonsgegevens.md
    - Entire: werkafspraken/entire.md
    - CEDA-agenda en mail: werkafspraken/ceda-agenda-en-mail.md
  - Handleidingen:
    - Overzicht: guides/index.md
    - Azure AI-modellen: guides/azure-ai.md
    - Entire CLI: guides/entire-cli.md

extra:
  generator: false

copyright: >-
  Centrum Educatieve Data Analyse (CEDA) · Onderdeel van <a href="https://npuls.nl/" target="_blank" rel="noopener">Npuls</a> · <a href="https://edu.nl/twt84" target="_blank" rel="noopener">CEDA-community</a> · <a href="mailto:ceda@surf.nl">ceda@surf.nl</a>

plugins:
  - search:
      lang: nl

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
